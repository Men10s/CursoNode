<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Inércia 2D - Dogfight & Perseguição Preditiva</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* HUD / Telemetria */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            font-family: monospace;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            background: rgba(0, 0, 0, 0.55);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
            line-height: 1.6;
            backdrop-filter: blur(5px);
            min-width: 220px;
        }

        #hud span {
            color: #00ffcc;
        }

        #hud .warn {
            color: #ff3366;
            font-weight: bold;
        }

        .bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
            margin-bottom: 8px;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.1s linear;
        }

        #player-hp-fill { background: #00ffcc; }
        #enemy-hp-fill { background: #ff3366; }

        /* Bússola apontando para o inimigo */
        #compass {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 1px solid rgba(255, 51, 102, 0.4);
            background: rgba(0,0,0,0.5);
            pointer-events: none;
            display: none;
        }

        #compass-arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 16px solid #ff3366;
            transform-origin: 50% 70%;
            transform: translate(-50%, -70%) rotate(0deg);
        }

        #compass-label {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            font-family: monospace;
            color: rgba(255, 51, 102, 0.8);
            white-space: nowrap;
        }

        /* Dicas de Controle Desktop */
        #controls-hint {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 14px;
            border-radius: 6px;
            pointer-events: none;
            text-align: right;
            line-height: 1.5;
        }

        #controls-hint b {
            color: rgba(255,255,255,0.9);
        }

        /* Controles Touch Mobile */
        .touch-zone {
            position: absolute;
            bottom: 25px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        #touch-left-zone { left: 20px; }
        #touch-right-zone { right: 20px; align-items: center; }

        .touch-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            touch-action: manipulation;
        }

        .touch-btn:active, .touch-btn.active {
            background: rgba(0, 255, 204, 0.3);
            border-color: #00ffcc;
            transform: scale(0.95);
        }

        #btn-thrust {
            width: 75px;
            height: 75px;
            background: rgba(255, 100, 50, 0.15);
            border-color: rgba(255, 100, 50, 0.4);
            font-weight: bold;
            font-size: 13px;
        }

        #btn-fire {
            width: 75px;
            height: 75px;
            background: rgba(255, 51, 102, 0.2);
            border-color: rgba(255, 51, 102, 0.5);
            font-weight: bold;
            font-size: 13px;
        }

        #btn-sound {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: rgba(255,255,255,0.6);
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 5px;
            padding: 6px 10px;
            cursor: pointer;
        }

        #pause-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.65);
            font-size: 28px;
            letter-spacing: 4px;
            color: #ffffff;
            pointer-events: none;
            flex-direction: column;
            gap: 10px;
        }

        @media (min-width: 1025px) {
            .touch-zone { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div id="hud">
        JOGADOR (HP):
        <div class="bar-container"><div id="player-hp-fill" class="bar-fill" style="width: 100%;"></div></div>
        CAÇADOR (HP):
        <div class="bar-container"><div id="enemy-hp-fill" class="bar-fill" style="width: 100%;"></div></div>
        VELOCIDADE: <span id="val-speed">0.0</span> px/s<br>
        DIST. INIMIGO: <span id="val-dist">0</span> px<br>
        G-FORCE: <span id="val-g">0.00</span> g
    </div>

    <div id="controls-hint">
        <b>Controles:</b><br>
        ← / → ou A / D : Girar Nave<br>
        ↑ / W / ESPAÇO : Propulsor<br>
        J / F / K : Atirar Laser<br>
        P : Pausar &nbsp; R : Reiniciar
    </div>

    <div id="compass">
        <div id="compass-arrow"></div>
        <div id="compass-label">INIMIGO</div>
    </div>

    <button id="btn-sound">🔈 SOM: OFF</button>

    <div id="pause-overlay"><div id="pause-title">PAUSADO</div></div>

    <!-- Controles Touch -->
    <div id="touch-left-zone" class="touch-zone">
        <div id="btn-rot-left" class="touch-btn">◄</div>
        <div id="btn-rot-right" class="touch-btn">►</div>
    </div>

    <div id="touch-right-zone" class="touch-zone">
        <div id="btn-thrust" class="touch-btn">PROP</div>
        <div id="btn-fire" class="touch-btn">TIRO</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Telemetria
        const valSpeed = document.getElementById('val-speed');
        const valDist = document.getElementById('val-dist');
        const valG = document.getElementById('val-g');
        const playerHpFill = document.getElementById('player-hp-fill');
        const enemyHpFill = document.getElementById('enemy-hp-fill');
        const compassEl = document.getElementById('compass');
        const compassArrow = document.getElementById('compass-arrow');
        const pauseOverlay = document.getElementById('pause-overlay');
        const pauseTitle = document.getElementById('pause-title');
        const soundBtn = document.getElementById('btn-sound');

        let DPR = Math.min(window.devicePixelRatio || 1, 2);
        function resizeCanvas() {
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = window.innerWidth * DPR;
            canvas.height = window.innerHeight * DPR;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function viewW() { return canvas.width / DPR; }
        function viewH() { return canvas.height / DPR; }

        // Estados das Entidades
        const player = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            angle: -Math.PI / 2,
            rotationSpeed: Math.PI * 1.3,
            thrustPower: 380,
            radius: 16,
            hp: 100,
            maxHp: 100,
            fireCooldown: 0,
            color: '#00ffcc'
        };

        const enemy = {
            x: 600,
            y: 400,
            vx: 0,
            vy: 0,
            angle: 0,
            rotationSpeed: Math.PI * 1.1,
            thrustPower: 340,
            radius: 16,
            hp: 120,
            maxHp: 120,
            fireCooldown: 0,
            color: '#ff3366',
            state: 'CHASE' // CHASE, RETREAT
        };

        const camera = { x: 0, y: 0, zoom: 1, lerpFactor: 0.08 };
        const input = { rotateLeft: false, rotateRight: false, thrust: false, fire: false };
        let paused = false;

        // Tiros e Partículas
        const bullets = [];
        const particles = [];
        const trail = [];

        // Áudio Sintetizado Web Audio
        let audioCtx = null;
        let engineOsc = null, engineGain = null, engineFilter = null;
        let soundEnabled = false;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            engineOsc = audioCtx.createOscillator();
            engineOsc.type = 'sawtooth';
            engineOsc.frequency.value = 55;

            engineFilter = audioCtx.createBiquadFilter();
            engineFilter.type = 'lowpass';
            engineFilter.frequency.value = 350;

            engineGain = audioCtx.createGain();
            engineGain.gain.value = 0;

            engineOsc.connect(engineFilter);
            engineFilter.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }

        function playSoundEffect(freq, duration, type='square') {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function setEngineSound(active) {
            if (!soundEnabled || !engineGain) return;
            engineGain.gain.setTargetAtTime(active ? 0.05 : 0, audioCtx.currentTime, 0.05);
            engineFilter.frequency.setTargetAtTime(active ? 500 : 350, audioCtx.currentTime, 0.1);
        }

        soundBtn.addEventListener('click', () => {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            soundEnabled = !soundEnabled;
            soundBtn.textContent = soundEnabled ? '🔊 SOM: ON' : '🔈 SOM: OFF';
            if (!soundEnabled && engineGain) engineGain.gain.value = 0;
        });

        // Eventos Teclado
        window.addEventListener('keydown', (e) => {
            if (['ArrowLeft', 'a', 'A'].includes(e.key)) input.rotateLeft = true;
            if (['ArrowRight', 'd', 'D'].includes(e.key)) input.rotateRight = true;
            if (['ArrowUp', 'w', 'W', ' '].includes(e.key)) input.thrust = true;
            if (['j', 'J', 'f', 'F', 'k', 'K'].includes(e.key)) input.fire = true;

            if (e.key === 'p' || e.key === 'P') togglePause();
            if (e.key === 'r' || e.key === 'R') resetGame();

            if ([' ', 'ArrowUp', 'ArrowLeft', 'ArrowRight', 'ArrowDown'].includes(e.key)) e.preventDefault();
        });

        window.addEventListener('keyup', (e) => {
            if (['ArrowLeft', 'a', 'A'].includes(e.key)) input.rotateLeft = false;
            if (['ArrowRight', 'd', 'D'].includes(e.key)) input.rotateRight = false;
            if (['ArrowUp', 'w', 'W', ' '].includes(e.key)) input.thrust = false;
            if (['j', 'J', 'f', 'F', 'k', 'K'].includes(e.key)) input.fire = false;
        });

        function togglePause() {
            paused = !paused;
            pauseTitle.textContent = "PAUSADO";
            pauseOverlay.style.display = paused ? 'flex' : 'none';
            if (paused) lastTime = null;
        }

        function resetGame() {
            player.x = 0; player.y = 0; player.vx = 0; player.vy = 0;
            player.angle = -Math.PI / 2; player.hp = player.maxHp;

            enemy.x = 800; enemy.y = 500; enemy.vx = 0; enemy.vy = 0;
            enemy.hp = enemy.maxHp;

            bullets.length = 0;
            particles.length = 0;
            trail.length = 0;
            paused = false;
            pauseOverlay.style.display = 'none';
        }

        function setupTouchButton(id, inputProperty) {
            const btn = document.getElementById(id);
            const start = (e) => { e.preventDefault(); input[inputProperty] = true; btn.classList.add('active'); };
            const end = (e) => { e.preventDefault(); input[inputProperty] = false; btn.classList.remove('active'); };

            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end, { passive: false });
            btn.addEventListener('touchcancel', end, { passive: false });
            btn.addEventListener('mousedown', (e) => { if (e.pointerType !== 'touch') start(e); });
            btn.addEventListener('mouseup', (e) => { if (e.pointerType !== 'touch') end(e); });
            btn.addEventListener('mouseleave', end);
        }

        setupTouchButton('btn-rot-left', 'rotateLeft');
        setupTouchButton('btn-rot-right', 'rotateRight');
        setupTouchButton('btn-thrust', 'thrust');
        setupTouchButton('btn-fire', 'fire');

        // Starfield Parallax
        const STAR_LAYERS = [
            { gridSize: 1200, perSector: 20, parallax: 0.4, sizeMul: 0.6, alphaMul: 0.5 },
            { gridSize: 900,  perSector: 28, parallax: 0.7, sizeMul: 0.85, alphaMul: 0.7 },
            { gridSize: 700,  perSector: 35, parallax: 1.0, sizeMul: 1.1, alphaMul: 1.0 }
        ];

        function hash2D(x, y) {
            let n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
            return n - Math.floor(n);
        }

        function drawBackgroundStars(camX, camY) {
            for (const layer of STAR_LAYERS) {
                const px = camX * layer.parallax, py = camY * layer.parallax;
                const w = viewW(), h = viewH();
                const startX = Math.floor((px - w / 2) / layer.gridSize) - 1;
                const endX = Math.floor((px + w / 2) / layer.gridSize) + 1;
                const startY = Math.floor((py - h / 2) / layer.gridSize) - 1;
                const endY = Math.floor((py + h / 2) / layer.gridSize) + 1;

                for (let secX = startX; secX <= endX; secX++) {
                    for (let secY = startY; secY <= endY; secY++) {
                        for (let i = 0; i < layer.perSector; i++) {
                            const seedX = hash2D(secX * 3.1 + layer.gridSize, secY + i * 0.1);
                            const seedY = hash2D(secX + i * 0.2, secY * 3.1 + layer.gridSize);
                            const seedSize = hash2D(secX + i, secY + i);

                            const screenX = (secX + seedX) * layer.gridSize - px + w / 2;
                            const screenY = (secY + seedY) * layer.gridSize - py + h / 2;

                            ctx.globalAlpha = (0.25 + seedSize * 0.55) * layer.alphaMul;
                            ctx.fillStyle = '#ffffff';
                            ctx.beginPath();
                            ctx.arc(screenX, screenY, seedSize * 1.5 * layer.sizeMul, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }
            }
            ctx.globalAlpha = 1.0;
        }

        // Sistema de Armas e Disparos
        function shootBullet(shooter, isPlayer) {
            if (shooter.fireCooldown > 0) return;
            shooter.fireCooldown = 0.18; // 180ms entre tiros

            const speed = 750;
            const muzzleDist = shooter.radius + 4;
            const bx = shooter.x + Math.cos(shooter.angle) * muzzleDist;
            const by = shooter.y + Math.sin(shooter.angle) * muzzleDist;

            // Conservação de momento: a velocidade da bala soma com a da nave
            bullets.push({
                x: bx,
                y: by,
                vx: shooter.vx + Math.cos(shooter.angle) * speed,
                vy: shooter.vy + Math.sin(shooter.angle) * speed,
                life: 1.8,
                isPlayer: isPlayer,
                color: isPlayer ? '#00ffcc' : '#ff3366'
            });

            playSoundEffect(isPlayer ? 600 : 400, 0.08, 'sawtooth');
        }

        function updateBullets(dt) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                b.life -= dt;

                // Colisão Bala x Jogador / Inimigo
                const target = b.isPlayer ? enemy : player;
                const dist = Math.hypot(b.x - target.x, b.y - target.y);

                if (dist < target.radius + 4 && target.hp > 0) {
                    target.hp -= 12;
                    createExplosion(b.x, b.y, b.color, 10);
                    playSoundEffect(120, 0.15, 'square');
                    bullets.splice(i, 1);
                    continue;
                }

                if (b.life <= 0) bullets.splice(i, 1);
            }
        }

        function drawBullets(camX, camY) {
            ctx.save();
            for (const b of bullets) {
                const sx = b.x - camX + viewW() / 2;
                const sy = b.y - camY + viewH() / 2;

                ctx.strokeStyle = b.color;
                ctx.lineWidth = 3;
                ctx.shadowColor = b.color;
                ctx.shadowBlur = 8;

                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(sx - b.vx * 0.03, sy - b.vy * 0.03); // Rastro do projetil
                ctx.stroke();
            }
            ctx.restore();
        }

        // IA DE PERSEGUIÇÃO PREDITIVA (Interceptação Cinemática)
        function updateEnemyAI(dt) {
            if (enemy.hp <= 0) return;

            const bulletSpeed = 750;
            const dx = player.x - enemy.x;
            const dy = player.y - enemy.y;
            const dist = Math.hypot(dx, dy);

            // Resolução do triângulo de interceptação cinemática para acertar nave em movimento
            const relVx = player.vx - enemy.vx;
            const relVy = player.vy - enemy.vy;
            const timeToImpact = dist / bulletSpeed;

            // Ponto Preditivo Futuro onde o jogador estará
            const targetX = player.x + relVx * timeToImpact;
            const targetY = player.y + relVy * timeToImpact;

            const targetAngle = Math.atan2(targetY - enemy.y, targetX - enemy.x);
            
            // Suavização do giro da IA
            let angleDiff = targetAngle - enemy.angle;
            angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));

            if (Math.abs(angleDiff) > 0.05) {
                enemy.angle += Math.sign(angleDiff) * enemy.rotationSpeed * dt;
            }

            // Controle Inteligente de Propulsão da IA
            const aimingAtPlayer = Math.abs(angleDiff) < 0.3;
            if (dist > 250 && aimingAtPlayer) {
                enemy.vx += Math.cos(enemy.angle) * enemy.thrustPower * dt;
                enemy.vy += Math.sin(enemy.angle) * enemy.thrustPower * dt;
                createThrustParticle(enemy, false);
            } else if (dist < 150) {
                // Inércia de afastamento para não colidir frontalmente
                enemy.vx -= Math.cos(enemy.angle) * (enemy.thrustPower * 0.5) * dt;
                enemy.vy -= Math.sin(enemy.angle) * (enemy.thrustPower * 0.5) * dt;
            }

            // Disparo com boa mira
            if (dist < 700 && Math.abs(angleDiff) < 0.25) {
                shootBullet(enemy, false);
            }

            // Inércia da IA
            enemy.x += enemy.vx * dt;
            enemy.y += enemy.vy * dt;
        }

        // Partículas e Explosões
        function createThrustParticle(shipObj, isPlayer) {
            const rearDist = shipObj.radius;
            const px = shipObj.x - Math.cos(shipObj.angle) * rearDist;
            const py = shipObj.y - Math.sin(shipObj.angle) * rearDist;

            const spread = (Math.random() - 0.5) * 0.5;
            const pAngle = shipObj.angle + Math.PI + spread;
            const speed = 140 + Math.random() * 100;

            particles.push({
                x: px, y: py,
                vx: shipObj.vx + Math.cos(pAngle) * speed,
                vy: shipObj.vy + Math.sin(pAngle) * speed,
                life: 1.0, decay: 2.2 + Math.random() * 2,
                size: 2.5 + Math.random() * 1.5,
                color: isPlayer ? '255, 120, 50' : '255, 51, 102'
            });
        }

        function createExplosion(x, y, colorHex, count = 25) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 50 + Math.random() * 250;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0, decay: 1.2 + Math.random() * 1.5,
                    size: 2 + Math.random() * 3,
                    customColor: colorHex
                });
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= p.decay * dt;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles(camX, camY) {
            for (const p of particles) {
                const sx = p.x - camX + viewW() / 2;
                const sy = p.y - camY + viewH() / 2;

                ctx.fillStyle = p.customColor || `rgba(${p.color}, ${p.life})`;
                ctx.beginPath();
                ctx.arc(sx, sy, Math.max(0.1, p.life * p.size * 2), 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Desenho de Naves
        function drawShip(shipObj, camX, camY) {
            if (shipObj.hp <= 0) return;

            const sx = shipObj.x - camX + viewW() / 2;
            const sy = shipObj.y - camY + viewH() / 2;

            ctx.save();
            ctx.translate(sx, sy);
            ctx.rotate(shipObj.angle);

            ctx.shadowColor = shipObj.color;
            ctx.shadowBlur = 10;
            ctx.lineWidth = 2;
            ctx.strokeStyle = shipObj.color;
            ctx.fillStyle = '#0a1e24';

            ctx.beginPath();
            ctx.moveTo(shipObj.radius, 0);
            ctx.lineTo(-shipObj.radius * 0.8, -shipObj.radius * 0.7);
            ctx.lineTo(-shipObj.radius * 0.4, 0);
            ctx.lineTo(-shipObj.radius * 0.8, shipObj.radius * 0.7);
            ctx.closePath();

            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }

        function updateCompass() {
            const dx = enemy.x - player.x;
            const dy = enemy.y - player.y;
            const dist = Math.hypot(dx, dy);

            const onScreen = Math.abs(dx) < viewW() / 2 && Math.abs(dy) < viewH() / 2;

            if (dist > 350 && !onScreen && enemy.hp > 0) {
                compassEl.style.display = 'block';
                const angle = Math.atan2(dy, dx);
                compassArrow.style.transform = `translate(-50%, -70%) rotate(${angle + Math.PI / 2}rad)`;
            } else {
                compassEl.style.display = 'none';
            }
        }

        // Loop Principal
        let lastTime = null;
        let prevSpeed = 0;

        function gameLoop(now) {
            if (lastTime === null) lastTime = now;
            let dt = (now - lastTime) / 1000;
            lastTime = now;
            if (dt > 0.1) dt = 0.1;

            if (!paused) {
                if (player.fireCooldown > 0) player.fireCooldown -= dt;
                if (enemy.fireCooldown > 0) enemy.fireCooldown -= dt;

                // Controles Jogador
                if (player.hp > 0) {
                    if (input.rotateLeft) player.angle -= player.rotationSpeed * dt;
                    if (input.rotateRight) player.angle += player.rotationSpeed * dt;
                    player.angle = Math.atan2(Math.sin(player.angle), Math.cos(player.angle));

                    if (input.thrust) {
                        player.vx += Math.cos(player.angle) * player.thrustPower * dt;
                        player.vy += Math.sin(player.angle) * player.thrustPower * dt;
                        createThrustParticle(player, true);
                    }
                    if (input.fire) shootBullet(player, true);

                    setEngineSound(input.thrust);

                    player.x += player.vx * dt;
                    player.y += player.vy * dt;
                } else {
                    setEngineSound(false);
                }

                // Atualizar Inimigo e Balas
                updateEnemyAI(dt);
                updateBullets(dt);
                updateParticles(dt);
                updateCompass();

                // Câmera
                camera.x += (player.x - camera.x) * camera.lerpFactor;
                camera.y += (player.y - camera.y) * camera.lerpFactor;

                const speed = Math.hypot(player.vx, player.vy);
                const targetZoom = Math.max(0.7, 1 - speed / 3200);
                camera.zoom += (targetZoom - camera.zoom) * 0.05;

                // Checagem de Fim de Jogo
                if (player.hp <= 0 && !paused) {
                    createExplosion(player.x, player.y, player.color, 40);
                    paused = true;
                    pauseTitle.innerHTML = "SUA NAVE FOI DESTRUÍDA!<br><span style='font-size:14px;color:#aaa'>Pressione R para reiniciar</span>";
                    pauseOverlay.style.display = 'flex';
                } else if (enemy.hp <= 0 && enemy.maxHp > 0) {
                    createExplosion(enemy.x, enemy.y, enemy.color, 50);
                    enemy.maxHp = 0; // Evita múltiplas explosões
                }

                // Telemetria G-Force
                const gForce = dt > 0 ? Math.abs(speed - prevSpeed) / dt / 980 : 0;
                prevSpeed = speed;
                valG.textContent = gForce.toFixed(2);
                valG.className = gForce > 2 ? 'warn' : '';
            }

            // Renderização
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            ctx.clearRect(0, 0, viewW(), viewH());

            ctx.save();
            ctx.translate(viewW() / 2, viewH() / 2);
            ctx.scale(camera.zoom, camera.zoom);
            ctx.translate(-viewW() / 2, -viewH() / 2);

            drawBackgroundStars(camera.x, camera.y);
            drawBullets(camera.x, camera.y);
            drawParticles(camera.x, camera.y);
            drawShip(player, camera.x, camera.y);
            drawShip(enemy, camera.x, camera.y);

            ctx.restore();

            // Atualização da HUD
            const speed = Math.hypot(player.vx, player.vy);
            const enemyDist = Math.hypot(enemy.x - player.x, enemy.y - player.y);

            valSpeed.textContent = speed.toFixed(1);
            valDist.textContent = Math.round(enemyDist);
            playerHpFill.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
            enemyHpFill.style.width = Math.max(0, (enemy.hp / 120) * 100) + '%';

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
